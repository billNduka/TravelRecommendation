<!DOCTYPE html>
<html>
<head>
  <title>Travel Recommendations Contact page</title>
  <style>
    body {
      background: url(./backgroundimg.webp);
    }
    nav {
      background: #333;
      border: 3px double #888;
      padding: 10px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: space-between;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    div {
      background: #333;
      border: 3px double #888;
      padding: 10px;
      color: white;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="travel_recommendation.html">Home</a></li>
      <li><a href="about.html">About us</a></li>
      <li><a href="contact.html">Contact us</a></li>
      <li><input type="search" placeholder="Search locations"></li>
      <li><button>Reset</button></li>
    </ul>
  </nav>

  <h1>Contact Us</h1>
  <p>Have a question or want help picking your next destination? Send us a message and we will get back to you.</p>

  <div>
    <h1>Send us a message</h1>
    <form>
      <p>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name">
      </p>
      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email">
      </p>
      <p>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="40"></textarea>
      </p>
      <button type="submit">Send</button>
    </form>
  </div>

  <br>

  <div>
    <h1>Other ways to reach us</h1>
    <p>Email: info@travelrecommendations.com</p>
    <p>Phone: +234 000 000 0000</p>
    <p>Address: Lagos, Nigeria</p>
  </div>

</body>
</html>
